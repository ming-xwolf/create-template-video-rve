<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>RVE Prism</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('../assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:transparent; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden; transparent
    font-family:'Noto Sans SC', sans-serif; color:#eef3fb; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }

  .wrap { position:absolute; left:80px; right:80px; bottom:240px; }
  .panel { position:relative; display:flex; align-items:center; gap:0px;
    padding:26px; border-radius:22px;
    background:rgba(4,6,15,.62); border:1px solid rgba(255,255,255,.13);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.09);
    overflow:hidden; opacity:0; transform:translateY(26px);
    animation:fadeUp .75s cubic-bezier(.16,1,.3,1) .15s forwards; }
  .bar { position:absolute; left:0; top:0; bottom:0; width:9px;
    background:linear-gradient(180deg,#7dd3fc,#38bdf8 40%,#9d7bff);
    box-shadow:0 0 26px rgba(56,189,248,.6); transform:scaleY(0); transform-origin:bottom;
    animation:barIn .7s cubic-bezier(.16,1,.3,1) .3s forwards; }
  @keyframes barIn { to { transform:scaleY(1); } }
  .body { margin-left:9px; width:100%; }
  .nameclip { overflow:hidden; }
  .name { font-size:50px; font-weight:800; letter-spacing:-.01em; line-height:1.15;
    transform:translateY(110%); animation:reveal .8s cubic-bezier(.16,1,.3,1) .45s forwards; }
  @keyframes reveal { to { transform:translateY(0); } }
  .role { margin-top:8px; font-size:28px; color:#9db0d6; letter-spacing:.12em;
    opacity:0; animation:fadeUp .7s ease-out .75s forwards; }

</style></head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8"
       data-width="1080" data-height="1920"
       data-composition-variables='{"name": "林研究员", "role": "计算生物学 · 斯克里普斯"}'>

    <div class="wrap"><div class="panel">
      <div class="bar"></div>
      <div class="body">
        <div class="nameclip"><div class="name"></div></div>
        <div class="role"></div>
      </div>
    </div></div>

  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      var set = function (sel, x) { var el = document.querySelector(sel); if (el && x != null) el.textContent = String(x); };
      set(".name", v.name); set(".role", v.role);
    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause:function(){}, seek:function(){}, paused:function(){ return true; } };
</script>
</body></html>

<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>RVE Line Chart</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#04060f; }
  #root { position:relative; width:1920px; height:1080px; overflow:hidden;
    background: radial-gradient(70% 50% at 78% 12%, rgba(56,189,248,.14), transparent 62%),
                radial-gradient(60% 45% at 12% 88%, rgba(157,123,255,.12), transparent 66%),
                #04060f;
    font-family: 'Noto Sans SC', sans-serif; color:#eef3fb; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

  .head { position:absolute; left:110px; right:110px; top:90px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:24px; }
  .kicker { font-size:30px; letter-spacing:.3em; text-transform:uppercase; color:#38bdf8; font-weight:600;
    opacity:0; animation:fadeUp .6s ease-out .2s forwards; }
  .title { margin-top:18px; font-size:58px; font-weight:800; letter-spacing:-.02em; line-height:1.1;
    opacity:0; animation:fadeUp .7s ease-out .35s forwards; }
  .kpi { font-size:150px; font-weight:900; letter-spacing:-.04em; line-height:1;
    background:linear-gradient(150deg,#7dd3fc,#38bdf8 45%,#9d7bff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 40px rgba(56,189,248,.30));
    opacity:0; animation:fadeUp .8s cubic-bezier(.16,1,.3,1) .9s forwards; }
  .chart { position:absolute; left:0; right:0; top:300px; height:600px; width:100%; }
  .grid line { stroke:rgba(255,255,255,.07); stroke-width:1; }
  #line { fill:none; stroke:url(#stroke); stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:var(--len,2000); stroke-dashoffset:var(--len,2000);
    filter:drop-shadow(0 0 10px rgba(56,189,248,.55));
    animation:draw 1.7s cubic-bezier(.22,.61,.36,1) .45s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  #area { opacity:0; animation:fadeIn .9s ease-out 1.5s forwards; }
  @keyframes fadeIn { to { opacity:.9; } }
  #tip { opacity:0; animation:pop .5s cubic-bezier(.16,1,.3,1) 2.0s forwards, pulse 2.4s ease-in-out 2.4s infinite; }
  @keyframes pop { from { opacity:0; transform:scale(.2); } to { opacity:1; transform:scale(1); } }
  @keyframes pulse { 0%,100%{ opacity:.85; } 50%{ opacity:.35; } }
  .xlab text { fill:#9db0d6; font-size:22px; letter-spacing:.08em; }
  .xlab text { opacity:0; animation:fadeIn .6s ease-out 1.4s forwards; }

  .grain { position:absolute; inset:0; width:100%; height:100%; opacity:.05; mix-blend-mode:overlay; pointer-events:none; }
</style></head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8"
       data-width="1920" data-height="1080"
       data-composition-variables='{"kicker": "增长曲线", "title": "分布式智能体引用的文献数", "kpi": "+218%", "series": [120, 180, 150, 270, 240, 380, 520, 610]}'>

    <div class="head">
      <div><div class="kicker"></div><div class="title"></div></div>
      <div class="kpi"></div>
    </div>
    <svg class="chart" viewBox="0 0 1920 600">
      <defs>
        <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7dd3fc"/><stop offset="55%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#9d7bff"/>
        </linearGradient>
        <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity=".38"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g class="grid" id="grid"></g>
      <path id="area" fill="url(#fill)"/>
      <path id="line"/>
      <circle id="tip" r="9" fill="#7dd3fc"/>
    </svg>

  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      var series = Array.isArray(v.series) ? v.series.map(Number) : [12, 18, 15, 27, 24, 38, 52, 61];
      if (series.length < 2) series = [12, 18, 15, 27, 24, 38, 52, 61];
      var Wp = 1920, Hp = 600, PAD = 26;
      var min = Math.min.apply(null, series), max = Math.max.apply(null, series);
      var span = (max - min) || 1;
      var pts = series.map(function (val, i) {
        var x = PAD + i * (Wp - 2 * PAD) / (series.length - 1);
        var y = (Hp - PAD) - (val - min) / span * (Hp - 2 * PAD);
        return [x, y];
      });
      var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
      var line = document.getElementById("line");
      line.setAttribute("d", d);
      var area = document.getElementById("area");
      area.setAttribute("d", d + " L" + pts[pts.length-1][0].toFixed(1) + " " + Hp + " L" + pts[0][0].toFixed(1) + " " + Hp + " Z");
      var len = line.getTotalLength ? line.getTotalLength() : 2000;
      line.style.setProperty("--len", len);
      line.style.strokeDasharray = len; line.style.strokeDashoffset = len;
      var tip = document.getElementById("tip");
      tip.setAttribute("cx", pts[pts.length-1][0]); tip.setAttribute("cy", pts[pts.length-1][1]);
      var grid = document.getElementById("grid");
      for (var g = 1; g <= 4; g++) {
        var y = PAD + g * (Hp - 2*PAD) / 5;
        grid.innerHTML += '<line x1="0" y1="'+y+'" x2="'+Wp+'" y2="'+y+'"/>';
      }
      var set = function (sel, val) { var el = document.querySelector(sel); if (el && val != null) el.textContent = String(val); };
      set(".kicker", v.kicker); set(".title", v.title); set(".kpi", v.kpi);

    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause: function(){}, seek: function(){}, paused: function(){ return true; } };
</script>
</body></html>

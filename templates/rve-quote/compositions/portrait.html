<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>RVE Quote</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('../assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#04060f; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden;
    background: radial-gradient(70% 50% at 78% 10%, rgba(56,189,248,.14), transparent 62%),
                radial-gradient(60% 45% at 10% 90%, rgba(157,123,255,.12), transparent 66%),
                #04060f;
    font-family: 'Noto Sans SC', sans-serif; color:#eef3fb; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .grain { position:absolute; inset:0; width:100%; height:100%; opacity:.05; mix-blend-mode:overlay; pointer-events:none; }

  .spot { position:absolute; inset:0;
    background:radial-gradient(42% 36% at 50% 34%, rgba(56,189,248,.30), transparent 68%);
    animation:sway 9s ease-in-out infinite alternate; }
  @keyframes sway { from{transform:translate(-3%,-2%) scale(.96)} to{transform:translate(3%,2%) scale(1.06)} }
  .blob { position:absolute; border-radius:50%; filter:blur(90px); opacity:.36; }
  .b1 { width:52vw; height:52vw; left:-16vw; top:6vh; background:radial-gradient(circle,#9d7bff,transparent 62%); }
  .b2 { width:48vw; height:48vw; right:-14vw; bottom:4vh; background:radial-gradient(circle,#38bdf8,transparent 62%); }
  .qm { position:absolute; left:80px; top:180px; font-size:240px; line-height:1; color:rgba(56,189,248,.22);
    font-weight:900; animation:fadeUp .8s ease-out .2s both; }
  .card { position:absolute; left:80px; right:80px; top:560px;
    padding:52px; border-radius:34px;
    background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.10);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
    opacity:0; transform:translateY(30px); animation:cardIn .9s cubic-bezier(.16,1,.3,1) .35s forwards; }
  @keyframes cardIn { to { opacity:1; transform:translateY(0); } }
  .stars { display:flex; gap:8px; margin-bottom:26px; }
  .stars svg { width:26px; height:26px; fill:#38bdf8; opacity:0;
    filter:drop-shadow(0 0 10px rgba(56,189,248,.6)); animation:pop .5s cubic-bezier(.16,1,.3,1) var(--d) forwards; }
  @keyframes pop { from{opacity:0;transform:scale(.3)} to{opacity:1;transform:scale(1)} }
  .q { font-size:56px; line-height:1.5; font-weight:500; letter-spacing:-.01em; }
  .who { margin-top:30px; display:flex; align-items:center; gap:16px; }
  .avatar { width:96px; height:96px; border-radius:50%;
    background:linear-gradient(140deg,#38bdf8,#9d7bff); display:flex; align-items:center; justify-content:center;
    font-size:44px; font-weight:800; color:#04060f; }
  .author { font-size:32px; font-weight:700; }
  .role { margin-top:4px; font-size:26px; color:#9db0d6; }

</style></head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8"
       data-width="1080" data-height="1920"
       data-composition-variables='{"quote": "我们原本以为这是加速，后来发现它换的是分工方式。", "author": "审稿专家", "role": "计算生物学", "stars": "5"}'>

    <div class="spot"></div><div class="blob b1"></div><div class="blob b2"></div>
    <div class="qm">&ldquo;</div>
    <div class="card">
      <div class="stars" id="stars"></div>
      <div class="q"></div>
      <div class="who">
        <div class="avatar" id="av"></div>
        <div><div class="author"></div><div class="role"></div></div>
      </div>
    </div>

  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      var n = Math.max(0, Math.min(5, parseInt(String(v.stars == null ? 5 : v.stars), 10) || 0));
      var star = '<svg viewBox="0 0 24 24" style="--d:{d}s"><path d="M12 2l3 6.9 7.5.6-5.7 4.9 1.8 7.3L12 17.8 5.1 21.7l1.8-7.3L1.2 9.5 8.7 8.9z"/></svg>';
      var html = "";
      for (var i = 0; i < n; i++) html += star.replace("{d}", (0.7 + i * 0.08).toFixed(2));
      document.getElementById("stars").innerHTML = html;
      var set = function (sel, x) { var el = document.querySelector(sel); if (el && x != null) el.textContent = String(x); };
      set(".q", v.quote); set(".author", v.author); set(".role", v.role);
      var av = document.getElementById("av");
      av.textContent = String(v.author || "?").trim().charAt(0) || "?";

    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause:function(){}, seek:function(){}, paused:function(){ return true; } };
</script>
</body></html>

<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>RVE Dual Area</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('../assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#04060f; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden;
    background: radial-gradient(70% 50% at 78% 10%, rgba(56,189,248,.14), transparent 62%),
                radial-gradient(60% 45% at 10% 90%, rgba(157,123,255,.12), transparent 66%),
                #04060f;
    font-family: 'Noto Sans SC', sans-serif; color:#eef3fb; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .grain { position:absolute; inset:0; width:100%; height:100%; opacity:.05; mix-blend-mode:overlay; pointer-events:none; }

  .head { position:absolute; left:70px; right:70px; top:130px; }
  .kicker { font-size:26px; letter-spacing:.3em; text-transform:uppercase; color:#38bdf8; font-weight:600;
    opacity:0; animation:fadeUp .6s ease-out .2s forwards; }
  .title { margin-top:16px; font-size:46px; font-weight:800; letter-spacing:-.02em;
    opacity:0; animation:fadeUp .7s ease-out .35s forwards; }
  .legend { display:flex; gap:34px; margin-top:22px; font-size:28px; color:#9db0d6;
    opacity:0; animation:fadeUp .6s ease-out .6s forwards; }
  .key { display:flex; align-items:center; gap:10px; }
  .dot { width:14px; height:14px; border-radius:50%; }
  .da { background:#38bdf8; box-shadow:0 0 14px rgba(56,189,248,.7); }
  .db { background:#9d7bff; box-shadow:0 0 14px rgba(157,123,255,.7); }
  .chart { position:absolute; left:0; right:0; top:560px; height:820px; width:100%; }
  .grid line { stroke:rgba(255,255,255,.07); stroke-width:1; }
  .ln { fill:none; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:var(--len,3000); stroke-dashoffset:var(--len,3000);
    animation:draw 1.9s cubic-bezier(.22,.61,.36,1) .5s forwards; }
  .ln-a { stroke:#38bdf8; filter:drop-shadow(0 0 10px rgba(56,189,248,.6)); }
  .ln-b { stroke:#9d7bff; filter:drop-shadow(0 0 10px rgba(157,123,255,.55)); }
  @keyframes draw { to { stroke-dashoffset:0; } }
  .ar { opacity:0; animation:fadeIn 1s ease-out 1.6s forwards; }
  .ar-b { mix-blend-mode:screen; }
  @keyframes fadeIn { to { opacity:1; } }
  .tip { opacity:0; animation:pop .5s cubic-bezier(.16,1,.3,1) 2.1s forwards; }
  @keyframes pop { from{opacity:0;transform:scale(.2)} to{opacity:1;transform:scale(1)} }

</style></head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8"
       data-width="1080" data-height="1920"
       data-composition-variables='{"kicker": "对比 · 两年", "title": "本期 vs 上期", "labelA": "本期", "labelB": "上期", "seriesA": [40, 52, 48, 66, 72, 88, 95, 110], "seriesB": [30, 36, 41, 44, 52, 58, 61, 70]}'>

    <div class="head">
      <div class="kicker"></div>
      <div class="title"></div>
      <div class="legend">
        <span class="key"><span class="dot da"></span><span id="la"></span></span>
        <span class="key"><span class="dot db"></span><span id="lb"></span></span>
      </div>
    </div>
    <svg class="chart" viewBox="0 0 1080 820">
      <defs>
        <linearGradient id="fa" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#38bdf8" stop-opacity=".52"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="fb" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#9d7bff" stop-opacity=".46"/><stop offset="100%" stop-color="#9d7bff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g class="grid" id="grid"></g>
      <path class="ar" id="areaA" fill="url(#fa)"/>
      <path class="ar ar-b" id="areaB" fill="url(#fb)"/>
      <path class="ln ln-b" id="lineB"/>
      <path class="ln ln-a" id="lineA"/>
      <circle class="tip" id="tipA" r="8" fill="#7dd3fc"/>
    </svg>

  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      function arr(x, dflt) {
        var a = Array.isArray(x) ? x.map(Number).filter(function(n){ return !isNaN(n); }) : [];
        return a.length >= 2 ? a : dflt;
      }
      var A = arr(v.seriesA, [40, 52, 48, 66, 72, 88, 95, 110]);
      var B = arr(v.seriesB, [30, 36, 41, 44, 52, 58, 61, 70]);
      var Wp = 1080, Hp = 820, PAD = 54;
      var all = A.concat(B), min = Math.min.apply(null, all), max = Math.max.apply(null, all);
      var span = (max - min) || 1, n = Math.max(A.length, B.length);
      function pts(s) {
        return s.map(function (val, i) {
          var x = PAD + i * (Wp - 2 * PAD) / (n - 1);
          var y = (Hp - PAD) - (val - min) / span * (Hp - 2 * PAD);
          return [x, y];
        });
      }
      function build(id, areaId, s) {
        var p = pts(s);
        var d = p.map(function (q, i) { return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" ");
        var ln = document.getElementById(id);
        ln.setAttribute("d", d);
        var len = ln.getTotalLength ? ln.getTotalLength() : 3000;
        ln.style.strokeDasharray = len; ln.style.strokeDashoffset = len;
        document.getElementById(areaId).setAttribute("d",
          d + " L" + p[p.length-1][0].toFixed(1) + " " + Hp + " L" + p[0][0].toFixed(1) + " " + Hp + " Z");
        return p[p.length-1];
      }
      build("lineA", "areaA", A); build("lineB", "areaB", B);
      var tip = document.getElementById("tipA"), last = pts(A)[A.length-1];
      tip.setAttribute("cx", last[0]); tip.setAttribute("cy", last[1]);
      var grid = document.getElementById("grid");
      for (var g = 1; g <= 4; g++) {
        var y = PAD + g * (Hp - 2*PAD) / 5;
        grid.innerHTML += '<line x1="0" y1="'+y+'" x2="'+Wp+'" y2="'+y+'"/>';
      }
      var set = function (sel, x) { var el = document.querySelector(sel); if (el && x != null) el.textContent = String(x); };
      set(".kicker", v.kicker); set(".title", v.title); set("#la", v.labelA || "本期"); set("#lb", v.labelB || "上期");

    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause:function(){}, seek:function(){}, paused:function(){ return true; } };
</script>
</body></html>

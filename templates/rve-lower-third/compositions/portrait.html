<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>RVE Lower Third</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('../assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  /* 叠加层：背景必须透明，pipeline 会把它 composite 到基础镜头之上。
     改编自 hyperframes-templates / lower-third（MIT）。 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; background:transparent; overflow:hidden; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden; background:transparent;
    font-family: 'Noto Sans SC', sans-serif; color:#eef3fb; }
  .l3 { position:absolute; left:80px; bottom:260px; display:flex; align-items:stretch; gap:22px;
    opacity:0; transform:translateX(-40px);
    animation:slideIn .7s cubic-bezier(.16,1,.3,1) .25s forwards; }
  .bar { width:8px; border-radius:999px;
    background:linear-gradient(180deg,#7dd3fc,#38bdf8 45%,#9d7bff);
    box-shadow:0 0 26px rgba(56,189,248,.65); }
  .text { display:flex; flex-direction:column; justify-content:center; gap:10px;
    padding:18px 30px; border-radius:18px;
    background:rgba(4,6,15,.55); border:1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); }
  .name { font-size:46px; font-weight:700; letter-spacing:-.01em; line-height:1; }
  .role { font-size:28px; font-weight:500; color:#9db0d6; letter-spacing:.06em; }
  @keyframes slideIn { to { opacity:1; transform:translateX(0); } }
</style></head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6"
       data-width="1080" data-height="1920"
       data-composition-variables='{"name":"","role":"","accent":""}'>
    <div class="l3"><div class="bar"></div>
      <div class="text"><div class="name"></div><div class="role"></div></div>
    </div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      var set = function (s, x) { var e = document.querySelector(s); if (e && x != null) e.textContent = String(x); };
      set(".name", v.name); set(".role", v.role);
    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause:function(){}, seek:function(){}, paused:function(){ return true; } };
  </script>
</body></html>

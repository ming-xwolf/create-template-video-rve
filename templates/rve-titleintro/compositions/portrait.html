<!doctype html>
<html lang="zh">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>Cinematic Title Intro · 9:16</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('../assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  /*
   * rve-titleintro — 电影感标题序（标题上浮 + 渐变线左→右生长 + 副标题延迟淡入）。
   * 参考 reactvideoeditor.com 的 Remotion CinematicTitleIntro（MIT）：三段动画
   * 依次点亮，spring(50→0) + interpolate 宽 0→100% + 副标题延迟。改写为 CSS
   * keyframes（spring/rAF 在逐帧渲染下会冻结），色板重映射到 tokens.json。
   * 和 rve-hook 刻意不同：hook 是新闻开场（标签/按钮/品牌/光斑），本模板只有
   * 标题 + 一条渐变线 + 副标题，留白极大。
   * 竖屏 9:16；横屏见 ../index.html。字号按窄画布重算。
   */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }

  :root {
    --rve-bg: #04060f; --rve-ink: #eef3fb;
    --rve-accent: #38bdf8; --rve-violet: #9d7bff;
  }

  #root {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(58% 44% at 50% 34%, rgba(56, 189, 248, .10), transparent 70%),
      linear-gradient(160deg, #0b0a1e 0%, var(--rve-bg) 62%);
    color: var(--rve-ink);
    font-family: 'Noto Sans SC', sans-serif;
  }

  /* 极轻的暗角，让居中的标题更"压得住" */
  #root::before {
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(70% 56% at 50% 48%, transparent 40%, rgba(0,0,0,.45) 100%);
  }
  #root::after {
    content: ""; position: absolute; inset: 0; z-index: 99; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .stage {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 76px; text-align: center;
  }

  /* 标题：位移 spring(50→0, 40f) + 透明度 spring(0→1, 30f)，两条动画并行 */
  @keyframes titleRise {
    0%   { transform: translateY(50px); }
    60%  { transform: translateY(-6px); }   /* damping 14 / mass .8 的回弹 */
    100% { transform: translateY(0); }
  }
  @keyframes titleFade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .title {
    font-size: 86px; font-weight: 500; letter-spacing: .07em; line-height: 1.3;
    max-width: 920px;
    animation:
      titleRise 1.33s cubic-bezier(.34, 1.4, .64, 1) both,
      titleFade 1s ease-out both;
  }

  /* 渐变色条：宽度 0 → 320px，从 0.67s 开始（参考 20–50 帧） */
  @keyframes ruleGrow {
    from { width: 0; }
    to   { width: 264px; }
  }
  .rule {
    height: 4px; border-radius: 2px; margin-top: 18px;
    background: linear-gradient(90deg, var(--rve-accent), var(--rve-violet));
    box-shadow: 0 0 26px rgba(99, 102, 241, .5);
    animation: ruleGrow 1s cubic-bezier(.4, 0, .2, 1) .67s both;
  }

  /* 副标题：1.33s → 2s（参考 40–60 帧） */
  @keyframes subIn { from { opacity: 0; } to { opacity: 1; } }
  .subtitle {
    margin-top: 30px;
    font-size: 29px; font-weight: 300; letter-spacing: .15em;
    color: rgba(238, 243, 251, .8);
    max-width: 880px;
    animation: subIn .67s ease-out 1.33s both;
  }

  /* 可选角标，留空即隐藏 */
  @keyframes noteIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .note {
    position: absolute; bottom: 74px; left: 0; right: 0; z-index: 3;
    text-align: center;
    font-size: 19px; font-weight: 300; letter-spacing: .3em;
    color: rgba(157, 176, 214, .55);
    animation: noteIn .6s ease-out 2s both;
  }
</style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="6"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"title":"你的故事从此开始","subtitle":"一段有质感的开场","note":"第 01 期"}'
        >
            <div class="stage">
                <h1 class="title"></h1>
                <div class="rule"></div>
                <p class="subtitle"></p>
            </div>
            <div class="note"></div>
        </div>

        <script>
            (function () {
                var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
                    ? window.__hyperframes.getVariables() : {};

                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null) el.textContent = String(text);
                };
                set(".title", v.title);
                set(".subtitle", v.subtitle);

                var note = document.querySelector(".note");
                if (note) {
                    if (v.note != null && String(v.note).length) note.textContent = String(v.note);
                    else note.style.display = "none";
                }
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = {
                pause: function () {},
                seek: function () {},
                paused: function () { return true; },
            };
        </script>
    </body>
</html>

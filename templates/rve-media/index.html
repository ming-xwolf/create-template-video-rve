<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>RVE Media · Landscape 16:9</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  /* rve-media — 横屏版：左下方文字块 + 左侧暗角，图片保持右侧主体可见。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #04060f; }
  #root {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: #04060f; color: #eef3fb;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 62% 50%;
    transform-origin: var(--focus, 62%) 50%;
    animation: kb 6s cubic-bezier(.22,.61,.36,1) forwards;
    will-change: transform;
  }
  @keyframes kb { from { transform: scale(1.04); } to { transform: scale(1.14); } }

  .scrim-l { position: absolute; inset: 0;
    background: linear-gradient(to right,
      rgba(4,6,15,.97) 0%, rgba(4,6,15,.86) 30%, rgba(4,6,15,.30) 58%, rgba(4,6,15,0) 78%); }
  .scrim-b { position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(4,6,15,.9) 0%, rgba(4,6,15,0) 42%); }

  .kicker { position: absolute; top: 96px; left: 120px; right: 120px;
    display: flex; align-items: center; gap: 22px; }
  .kicker .rule { width: 56px; height: 4px; background: #38bdf8;
    box-shadow: 0 0 18px rgba(56,189,248,.55);
    transform-origin: left center; transform: scaleX(0);
    animation: ruleX .7s cubic-bezier(.16,1,.3,1) .15s forwards; }
  .kicker .label { font-size: 24px; font-weight: 600; letter-spacing: .22em;
    text-transform: uppercase; color: #9db0d6;
    opacity: 0; animation: fadeUp .6s ease-out .3s forwards; }
  @keyframes ruleX { to { transform: scaleX(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  .copy { position: absolute; left: 120px; bottom: 190px; width: 980px; }
  .title { font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -.025em; }
  .title .t1 { display: block; opacity: 0; transform: translateY(30px);
    animation: fadeUp .7s cubic-bezier(.16,1,.3,1) .35s forwards; }
  .title .t2 { display: block; color: #38bdf8; opacity: 0; transform: translateY(30px);
    animation: fadeUp .7s cubic-bezier(.16,1,.3,1) .5s forwards; }
  .caption { margin-top: 26px; font-size: 34px; line-height: 1.5; color: #9db0d6;
    opacity: 0; animation: fadeUp .7s ease-out .75s forwards; }

  .footer { position: absolute; left: 120px; right: 120px; bottom: 82px;
    display: flex; align-items: center; gap: 28px; }
  .footer .rule { flex: 1; height: 1px; background: rgba(255,255,255,.10);
    transform-origin: left center; transform: scaleX(0);
    animation: ruleX .7s cubic-bezier(.16,1,.3,1) .9s forwards; }
  .footer .meta { display: flex; gap: 34px;
    font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: #9db0d6;
    opacity: 0; animation: fadeUp .6s ease-out 1.05s forwards; white-space: nowrap; }
  .footer .meta .src { color: #38bdf8; }

  .fallback { position: absolute; inset: 0; display: none;
    background:
      radial-gradient(60% 60% at 74% 26%, rgba(56,189,248,.22), transparent 62%),
      radial-gradient(70% 70% at 8% 80%, rgba(157,123,255,.18), transparent 66%),
      #04060f; }
  #root.no-image .fallback { display: block; }
  #root.no-image .photo { display: none; }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="8"
    data-width="1920"
    data-height="1080"
    data-composition-variables='{"image":"","kicker":"现场 · 资料图","title":["算力之争","转向电力"],"caption":"芯片不再是瓶颈，电力和冷却开始卡脖子。","focus":"62%","footer_left":"中文科技观察","footer_right":"local"}'
  >
    <div class="fallback"></div>
    <img class="photo" alt="" />
    <div class="scrim-l"></div>
    <div class="scrim-b"></div>

    <div class="kicker">
      <span class="rule"></span>
      <span class="label"></span>
    </div>

    <div class="copy">
      <div class="title">
        <span class="t1"></span>
        <span class="t2"></span>
      </div>
      <div class="caption"></div>
    </div>

    <div class="footer">
      <div class="rule"></div>
      <div class="meta">
        <span class="meta-left"></span>
        <span class="src meta-right"></span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var v = (window.__hyperframes &&
               typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      var root = document.getElementById("root");
      var set = function (sel, text) {
        var el = document.querySelector(sel);
        if (el && text != null) el.textContent = String(text);
      };
      var title = Array.isArray(v.title) ? v.title : (v.title ? [v.title] : []);
      var img = document.querySelector(".photo");
      if (v.image && String(v.image).trim()) {
        img.src = String(v.image);
        root.classList.remove("no-image");
      } else {
        root.classList.add("no-image");
      }
      if (v.focus) root.style.setProperty("--focus", String(v.focus));
      set(".kicker .label", v.kicker);
      set(".title .t1", title[0]);
      set(".title .t2", title[1]);
      set(".caption", v.caption);
      set(".footer .meta-left", v.footer_left);
      set(".footer .meta-right", v.footer_right);
    })();

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
  </script>
</body>
</html>

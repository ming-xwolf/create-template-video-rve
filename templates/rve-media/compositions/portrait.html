<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>RVE Media · Portrait 9:16</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('../assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  /* rve-media — 新闻配图页：缓慢推近的 Ken Burns + 下三分之一文案。
     颜色只取 templates/tokens.json；不要在本文件引入新色相。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #04060f; }
  #root {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background: #04060f; color: #eef3fb;
    font-family: 'Noto Sans SC', sans-serif;
  }

  /* ---- photo + Ken Burns ---- */
  .photo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 50%;
    transform-origin: var(--focus, 50%) 50%;
    animation: kb 6s cubic-bezier(.22,.61,.36,1) forwards;
    will-change: transform;
  }
  @keyframes kb { from { transform: scale(1.04); } to { transform: scale(1.15); } }

  /* ---- scrims: keep type legible without flattening the photo ---- */
  .scrim-b { position: absolute; inset: 0;
    background: linear-gradient(to top,
      rgba(4,6,15,.97) 0%, rgba(4,6,15,.88) 22%, rgba(4,6,15,.35) 48%, rgba(4,6,15,0) 72%); }
  .scrim-t { position: absolute; top: 0; left: 0; right: 0; height: 420px;
    background: linear-gradient(to bottom, rgba(4,6,15,.85), rgba(4,6,15,0)); }

  /* ---- kicker ---- */
  .kicker { position: absolute; top: 120px; left: 84px; right: 84px;
    display: flex; align-items: center; gap: 22px; }
  .kicker .rule { width: 56px; height: 4px; background: #38bdf8;
    box-shadow: 0 0 18px rgba(56,189,248,.55);
    transform-origin: left center; transform: scaleX(0);
    animation: ruleX .7s cubic-bezier(.16,1,.3,1) .15s forwards; }
  .kicker .label { font-size: 26px; font-weight: 600; letter-spacing: .22em;
    text-transform: uppercase; color: #9db0d6;
    opacity: 0; animation: fadeUp .6s ease-out .3s forwards; }
  @keyframes ruleX { to { transform: scaleX(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

  /* ---- bottom block ---- */
  .copy { position: absolute; left: 84px; right: 84px; bottom: 210px; }
  .title { font-weight: 800; font-size: 92px; line-height: 1.04; letter-spacing: -.02em; }
  .title .t1 { display: block; opacity: 0; transform: translateY(30px);
    animation: fadeUp .7s cubic-bezier(.16,1,.3,1) .35s forwards; }
  .title .t2 { display: block; color: #38bdf8; opacity: 0; transform: translateY(30px);
    animation: fadeUp .7s cubic-bezier(.16,1,.3,1) .5s forwards; }
  .caption { margin-top: 26px; font-size: 34px; line-height: 1.5; color: #9db0d6;
    opacity: 0; animation: fadeUp .7s ease-out .75s forwards; }

  /* ---- footer ---- */
  .footer { position: absolute; left: 84px; right: 84px; bottom: 96px; }
  .footer .rule { height: 1px; background: rgba(255,255,255,.10);
    transform-origin: left center; transform: scaleX(0);
    animation: ruleX .7s cubic-bezier(.16,1,.3,1) .9s forwards; }
  .footer .meta { display: flex; justify-content: space-between; margin-top: 18px;
    font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: #9db0d6;
    opacity: 0; animation: fadeUp .6s ease-out 1.05s forwards; }
  .footer .meta .src { color: #38bdf8; }

  /* ---- no-image fallback: 纯色渐变 + 排版，不留空镜 ---- */
  .fallback { position: absolute; inset: 0; display: none;
    background:
      radial-gradient(60% 40% at 76% 18%, rgba(56,189,248,.22), transparent 62%),
      radial-gradient(70% 50% at 12% 86%, rgba(157,123,255,.18), transparent 66%),
      #04060f; }
  #root.no-image .fallback { display: block; }
  #root.no-image .photo { display: none; }
  #root.no-image .scrim-t { display: none; }
</style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="8"
    data-width="1080"
    data-height="1920"
    data-composition-variables='{"image":"","kicker":"现场 · 资料图","title":["算力之争","转向电力"],"caption":"芯片不再是瓶颈，电力和冷却开始卡脖子。","focus":"50%","footer_left":"中文科技观察","footer_right":"local"}'
  >
    <div class="fallback"></div>
    <img class="photo" alt="" />
    <div class="scrim-t"></div>
    <div class="scrim-b"></div>

    <div class="kicker">
      <span class="rule"></span>
      <span class="label"></span>
    </div>

    <div class="copy">
      <div class="title">
        <span class="t1"></span>
        <span class="t2"></span>
      </div>
      <div class="caption"></div>
    </div>

    <div class="footer">
      <div class="rule"></div>
      <div class="meta">
        <span class="meta-left"></span>
        <span class="src meta-right"></span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var v = (window.__hyperframes &&
               typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      var root = document.getElementById("root");
      var set = function (sel, text) {
        var el = document.querySelector(sel);
        if (el && text != null) el.textContent = String(text);
      };
      var title = Array.isArray(v.title) ? v.title : (v.title ? [v.title] : []);
      var img = document.querySelector(".photo");
      if (v.image && String(v.image).trim()) {
        img.src = String(v.image);
        root.classList.remove("no-image");
      } else {
        root.classList.add("no-image");
      }
      if (v.focus) root.style.setProperty("--focus", String(v.focus));
      set(".kicker .label", v.kicker);
      set(".title .t1", title[0]);
      set(".title .t2", title[1]);
      set(".caption", v.caption);
      set(".footer .meta-left", v.footer_left);
      set(".footer .meta-right", v.footer_right);
    })();

    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause: function () {}, seek: function () {}, paused: function () { return true; } };
  </script>
</body>
</html>

<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>RVE Follow</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('../assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  /* 叠加层：关注按钮。改编自 hyperframes-templates / follow-pill（MIT）。
     背景必须透明，由 pipeline 以 ProRes 4444 渲染后合成。 */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; background:transparent; overflow:hidden; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden; background:transparent;
    font-family: 'Noto Sans SC', sans-serif; color:#eef3fb; }
  .pill { position:absolute; right:60px; top:120px; display:flex; align-items:center; gap:14px;
    padding:13px 20px 13px 12px; border-radius:999px;
    background:rgba(4,6,15,.62); border:1px solid rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    box-shadow:0 18px 44px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.10);
    opacity:0; transform:translateY(-18px) scale(.94);
    animation:popIn .6s cubic-bezier(.16,1,.3,1) .1s forwards; }
  @keyframes popIn { to { opacity:1; transform:translateY(0) scale(1); } }
  .av { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(140deg,#38bdf8,#9d7bff); color:#04060f; font-weight:800; font-size:28px; }
  .txt { display:flex; flex-direction:column; gap:2px; }
  .handle { font-size:34px; font-weight:700; letter-spacing:-.01em; }
  .note { font-size:24px; color:#9db0d6; letter-spacing:.08em; }
  .go { margin-left:6px; padding:11px 23px; border-radius:999px;
    font-size:27px; font-weight:700; color:#04060f;
    background:linear-gradient(120deg,#7dd3fc,#38bdf8);
    box-shadow:0 0 22px rgba(56,189,248,.55); }
</style></head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="6"
       data-width="1080" data-height="1920"
       data-composition-variables='{"handle":"@中文科技观察","note":"每天一条","label":"关注"}'>
    <div class="pill">
      <div class="av" id="av"></div>
      <div class="txt"><div class="handle"></div><div class="note"></div></div>
      <div class="go"></div>
    </div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      var set = function (s, x) { var e = document.querySelector(s); if (e && x != null) e.textContent = String(x); };
      set(".handle", v.handle); set(".note", v.note); set(".go", v.label || "关注");
      document.getElementById("av").textContent = String(v.handle || "@").replace(/^@/, "").charAt(0) || "@";
    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause:function(){}, seek:function(){}, paused:function(){ return true; } };
  </script>
</body></html>

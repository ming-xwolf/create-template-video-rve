<!doctype html>
<html lang="zh">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1920, height=1080" />
        <title>End Card · 16:9</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  /*
   * rve-endcard — 收尾卡（感谢观看 + 订阅按钮 + 社交圆点 + 工作室署名）。
   * 参考 reactvideoeditor.com 的 Remotion EndCard（MIT）：spring 缩放 + 呼吸光边框
   * + 延迟出现的按钮/图标。改写为 CSS keyframes（rAF/spring 在逐帧渲染下会冻结），
   * 色板重映射到 templates/tokens.json，槽位化。
   * Landscape 16:9；9:16 见 compositions/portrait.html。
   */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }

  :root {
    --rve-bg: #04060f; --rve-bg2: #0a1120; --rve-ink: #eef3fb;
    --rve-muted: #9db0d6; --rve-accent: #38bdf8;
    --rve-accent2: #22d3ee; --rve-violet: #9d7bff;
  }

  #root {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 42%, #0b0a1e 0%, var(--rve-bg) 70%);
    color: var(--rve-ink);
    font-family: 'Noto Sans SC', sans-serif;
  }

  /* ambient blooms — the signature RVE backdrop */
  #root::before {
    content: ""; position: absolute; inset: -8%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(46% 34% at 78% 12%, rgba(56,189,248,.18), transparent 62%),
      radial-gradient(52% 40% at 14% 88%, rgba(157,123,255,.14), transparent 66%);
  }
  /* film grain — keeps flat dark areas from banding */
  #root::after {
    content: ""; position: absolute; inset: 0; z-index: 99; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ---- card ---- */
  /* spring(0.8→1, damping 12) 的 CSS 近似：过冲式缓动 + 同长度的透明度淡入 */
  @keyframes cardIn {
    0%   { opacity: 0; transform: scale(.8); }
    55%  { opacity: 1; }
    100% { opacity: 1; transform: scale(1); }
  }
  .card {
    position: relative; z-index: 2;
    width: 1180px; padding: 76px 72px 64px;
    border-radius: 28px;
    background: rgba(17, 24, 39, .78);
    border: 2px solid rgba(56, 189, 248, .22);
    display: flex; flex-direction: column; align-items: center;
    animation: cardIn 1.15s cubic-bezier(.34, 1.56, .64, 1) both;
  }

  /* 呼吸光：参考里的 sin(frame*.08) ≈ 2.6s 周期，改成 2.6s alternate */
  @keyframes breathe {
    from { opacity: .3; }
    to   { opacity: .7; }
  }
  @keyframes breatheGlow {
    from { opacity: .12; }
    to   { opacity: .34; }
  }
  .ring {
    position: absolute; inset: -2px; border-radius: 28px; pointer-events: none;
    border: 2px solid var(--rve-accent);
    animation: breathe 1.3s ease-in-out infinite alternate;
  }
  .halo {
    position: absolute; inset: -3px; border-radius: 30px; pointer-events: none;
    box-shadow: 0 0 46px 6px rgba(67, 97, 238, .55), 0 0 90px 18px rgba(157, 123, 255, .22);
    animation: breatheGlow 1.3s ease-in-out infinite alternate;
  }

  /* ---- content ---- */
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .headline {
    font-size: 108px; font-weight: 800; letter-spacing: .02em; line-height: 1.1;
    text-align: center; max-width: 1000px;
    filter: drop-shadow(0 0 34px rgba(56, 189, 248, .22));
    animation: riseIn .8s ease-out .12s both;
  }

  .cta {
    margin-top: 52px;
    padding: 24px 62px; border-radius: 14px;
    background: linear-gradient(90deg, #38bdf8, #9d7bff);
    box-shadow: 0 14px 40px rgba(67, 97, 238, .35);
    font-size: 38px; font-weight: 700; letter-spacing: .06em; color: #04060f;
    animation: riseIn .7s cubic-bezier(.22, 1, .36, 1) .67s both;
  }

  .socials {
    display: flex; gap: 30px; margin-top: 54px;
    animation: riseIn .7s cubic-bezier(.22, 1, .36, 1) 1s both;
  }
  .dot {
    width: 84px; height: 84px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; color: #04060f;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 24px rgba(0,0,0,.35);
  }

  .studio {
    margin-top: 46px;
    font-size: 22px; font-weight: 300; letter-spacing: .34em;
    text-transform: uppercase; color: rgba(238, 243, 251, .5);
    animation: riseIn .7s ease-out 1.25s both;
  }

  .corner {
    position: absolute; bottom: 52px; z-index: 3;
    font-size: 16px; text-transform: uppercase; letter-spacing: 4px;
    opacity: .32; font-family: 'Noto Sans SC', monospace;
  }
  .corner.left { left: 90px; }
  .corner.right { right: 90px; }
</style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1920"
            data-height="1080"
            data-composition-variables='{"headline":"感谢观看","cta":"订阅 · 不迷路","socials":["官网","B站","公众号","播客"],"studio":"中文科技观察","corner_left":"RVE","corner_right":"下期见"}'
        >
            <div class="card">
                <div class="ring"></div>
                <div class="halo"></div>
                <h1 class="headline"></h1>
                <div class="cta"></div>
                <div class="socials" id="socials"></div>
                <p class="studio"></p>
            </div>

            <div class="corner left"></div>
            <div class="corner right"></div>
        </div>

        <script>
            (function () {
                var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
                    ? window.__hyperframes.getVariables() : {};

                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).length) el.textContent = String(text);
                };
                set(".headline", v.headline);
                set(".cta", v.cta);
                set(".studio", v.studio);
                set(".corner.left", v.corner_left);
                set(".corner.right", v.corner_right);

                // 四个社交圆点：只取标签首字，保持参考版的等距圆点排布。
                var colors = ["#38bdf8", "#22d3ee", "#9d7bff", "#7c5cff"];
                var box = document.getElementById("socials");
                var list = Array.isArray(v.socials) ? v.socials : [];
                if (!list.length) {
                    ["官网", "B站", "公众号", "播客"].forEach(function (x) { list.push(x); });
                }
                list.slice(0, 4).forEach(function (label, i) {
                    var d = document.createElement("div");
                    d.className = "dot";
                    d.style.background = "linear-gradient(150deg, " + colors[i % 4] + ", " + colors[(i + 1) % 4] + ")";
                    d.textContent = String(label).slice(0, 1);
                    d.title = String(label);
                    box.appendChild(d);
                });
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = {
                pause: function () {},
                seek: function () {},
                paused: function () { return true; },
            };
        </script>
    </body>
</html>

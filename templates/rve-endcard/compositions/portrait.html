<!doctype html>
<html lang="zh">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>End Card · 9:16</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('../assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  /*
   * rve-endcard — 9:16。与 index.html 同一套动效与槽位，只重排尺寸：
   * 画布变窄，卡片改为竖长比例，字号按宽度重算（约 0.8 倍）。
   */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }

  :root {
    --rve-bg: #04060f; --rve-bg2: #0a1120; --rve-ink: #eef3fb;
    --rve-muted: #9db0d6; --rve-accent: #38bdf8;
    --rve-accent2: #22d3ee; --rve-violet: #9d7bff;
  }

  #root {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #0b0a1e 0%, var(--rve-bg) 70%);
    color: var(--rve-ink);
    font-family: 'Noto Sans SC', sans-serif;
  }

  #root::before {
    content: ""; position: absolute; inset: -8%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(58% 30% at 76% 10%, rgba(56,189,248,.18), transparent 62%),
      radial-gradient(64% 34% at 16% 92%, rgba(157,123,255,.14), transparent 66%);
  }
  #root::after {
    content: ""; position: absolute; inset: 0; z-index: 99; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  @keyframes cardIn {
    0%   { opacity: 0; transform: scale(.8); }
    55%  { opacity: 1; }
    100% { opacity: 1; transform: scale(1); }
  }
  .card {
    position: relative; z-index: 2;
    width: 880px; padding: 88px 56px 72px;
    border-radius: 26px;
    background: rgba(17, 24, 39, .78);
    border: 2px solid rgba(56, 189, 248, .22);
    display: flex; flex-direction: column; align-items: center;
    animation: cardIn 1.15s cubic-bezier(.34, 1.56, .64, 1) both;
  }

  @keyframes breathe { from { opacity: .3; } to { opacity: .7; } }
  @keyframes breatheGlow { from { opacity: .12; } to { opacity: .34; } }
  .ring {
    position: absolute; inset: -2px; border-radius: 26px; pointer-events: none;
    border: 2px solid var(--rve-accent);
    animation: breathe 1.3s ease-in-out infinite alternate;
  }
  .halo {
    position: absolute; inset: -3px; border-radius: 28px; pointer-events: none;
    box-shadow: 0 0 40px 5px rgba(67, 97, 238, .55), 0 0 80px 16px rgba(157, 123, 255, .22);
    animation: breatheGlow 1.3s ease-in-out infinite alternate;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .headline {
    font-size: 88px; font-weight: 800; letter-spacing: .02em; line-height: 1.15;
    text-align: center; max-width: 720px;
    filter: drop-shadow(0 0 30px rgba(56, 189, 248, .22));
    animation: riseIn .8s ease-out .12s both;
  }

  .cta {
    margin-top: 56px;
    padding: 22px 54px; border-radius: 14px;
    background: linear-gradient(90deg, #38bdf8, #9d7bff);
    box-shadow: 0 14px 40px rgba(67, 97, 238, .35);
    font-size: 34px; font-weight: 700; letter-spacing: .06em; color: #04060f;
    animation: riseIn .7s cubic-bezier(.22, 1, .36, 1) .67s both;
  }

  .socials {
    display: flex; gap: 28px; margin-top: 58px;
    animation: riseIn .7s cubic-bezier(.22, 1, .36, 1) 1s both;
  }
  .dot {
    width: 78px; height: 78px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #04060f;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 24px rgba(0,0,0,.35);
  }

  .studio {
    margin-top: 48px;
    font-size: 20px; font-weight: 300; letter-spacing: .3em;
    text-transform: uppercase; color: rgba(238, 243, 251, .5);
    animation: riseIn .7s ease-out 1.25s both;
  }

  .corner {
    position: absolute; bottom: 64px; z-index: 3;
    font-size: 15px; text-transform: uppercase; letter-spacing: 4px;
    opacity: .32; font-family: 'Noto Sans SC', monospace;
  }
  .corner.left { left: 64px; }
  .corner.right { right: 64px; }
</style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="5"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"headline":"感谢观看","cta":"订阅 · 不迷路","socials":["官网","B站","公众号","播客"],"studio":"中文科技观察","corner_left":"RVE","corner_right":"下期见"}'
        >
            <div class="card">
                <div class="ring"></div>
                <div class="halo"></div>
                <h1 class="headline"></h1>
                <div class="cta"></div>
                <div class="socials" id="socials"></div>
                <p class="studio"></p>
            </div>

            <div class="corner left"></div>
            <div class="corner right"></div>
        </div>

        <script>
            (function () {
                var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
                    ? window.__hyperframes.getVariables() : {};

                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null && String(text).length) el.textContent = String(text);
                };
                set(".headline", v.headline);
                set(".cta", v.cta);
                set(".studio", v.studio);
                set(".corner.left", v.corner_left);
                set(".corner.right", v.corner_right);

                var colors = ["#38bdf8", "#22d3ee", "#9d7bff", "#7c5cff"];
                var box = document.getElementById("socials");
                var list = Array.isArray(v.socials) ? v.socials : [];
                if (!list.length) {
                    ["官网", "B站", "公众号", "播客"].forEach(function (x) { list.push(x); });
                }
                list.slice(0, 4).forEach(function (label, i) {
                    var d = document.createElement("div");
                    d.className = "dot";
                    d.style.background = "linear-gradient(150deg, " + colors[i % 4] + ", " + colors[(i + 1) % 4] + ")";
                    d.textContent = String(label).slice(0, 1);
                    d.title = String(label);
                    box.appendChild(d);
                });
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = {
                pause: function () {},
                seek: function () {},
                paused: function () { return true; },
            };
        </script>
    </body>
</html>

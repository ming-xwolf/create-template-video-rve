<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>RVE Notify</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:#04060f; }
  #root { position:relative; width:1920px; height:1080px; overflow:hidden;
    background: radial-gradient(70% 50% at 78% 10%, rgba(56,189,248,.14), transparent 62%),
                radial-gradient(60% 45% at 10% 90%, rgba(157,123,255,.12), transparent 66%), #04060f;
    font-family:'Noto Sans SC', sans-serif; color:#eef3fb; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  .head { position:absolute; left:110px; right:110px; top:90px;
    opacity:0; animation:fadeUp .7s ease-out .15s forwards; }
  .kicker { font-size:22px; letter-spacing:.3em; text-transform:uppercase; color:#38bdf8; font-weight:600; }
  .title { margin-top:14px; font-size:52px; font-weight:800; letter-spacing:-.02em; }
  /* 卡片按 --slot 逐个落位；单一 keyframes 靠变量适配任意槽位，
     不依赖 rAF 的弹簧积分（原 block 用 STIFF/DAMP 逐帧模拟，渲染会冻结）。 */
  .feed { position:absolute; left:110px; right:110px; top:250px; height:700px; }
  .card { position:absolute; left:0; right:0; height:128px;
    display:flex; align-items:center; gap:16px; padding:20px 25px;
    border-radius:22px;
    background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.10);
    box-shadow:0 22px 50px rgba(0,0,0,.40), inset 0 1px 0 rgba(255,255,255,.07);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    opacity:0;
    animation: enter .78s cubic-bezier(.16,1,.3,1) calc(.35s + var(--i) * .95s) both,
               leave .55s ease-in calc(5.55s + var(--i) * .07s) forwards; }
  @keyframes enter {
    from { opacity:0; transform:translateY(calc(var(--slot) * 142px - 44px)) scale(.94); }
    to   { opacity:1; transform:translateY(calc(var(--slot) * 142px)) scale(1); } }
  @keyframes leave { to { opacity:0; transform:translateY(calc(var(--slot) * 142px - 30px)) scale(.96); } }
  .ic { flex:0 0 auto; width:56px; height:56px; border-radius:14px;
    display:flex; align-items:center; justify-content:center; font-size:28px;
    box-shadow:0 0 22px rgba(56,189,248,.28); }
  .txt { min-width:0; flex:1; }
  .row { display:flex; align-items:baseline; gap:10px; }
  .name { font-size:30px; font-weight:700; letter-spacing:-.01em; }
  .time { margin-left:auto; font-size:22px; color:#9db0d6; white-space:nowrap; }
  .body { margin-top:6px; font-size:25px; color:#c7d3ea; line-height:1.35;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style></head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8"
       data-width="1920" data-height="1080"
       data-composition-variables='{"kicker":"消息","title":"同时发生的三件事","items":[]}'>
    <div class="head"><div class="kicker"></div><div class="title"></div></div>
    <div class="feed" id="feed"></div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      var items = Array.isArray(v.items) ? v.items.slice(0, 5) : [
        { icon: "文", title: "三篇新预印本", time: "刚刚", body: "同一周内出现三个独立复现", tone: "info" },
        { icon: "刊", title: "期刊回应", time: "1 小时", body: "编辑部要求补充计算可复现性材料", tone: "warn" },
        { icon: "资", title: "资助方表态", time: "3 小时", body: "将把评审记录纳入下一年度评估", tone: "good" } ];
      var TONES = {
        info: "linear-gradient(135deg,#38bdf8,#0ea5e9)",
        good: "linear-gradient(135deg,#34d399,#059669)",
        warn: "linear-gradient(135deg,#fbbf24,#f59e0b)",
        bad:  "linear-gradient(135deg,#fb7185,#e11d48)"
      };
      var feed = document.getElementById("feed"), html = "", n = items.length;
      items.forEach(function (it, i) {
        var slot = n - 1 - i;  // 最新的在最上面
        html += '<div class="card" style="--i:' + i + ';--slot:' + slot + '">' +
          '<div class="ic" style="background:' + (TONES[it.tone] || TONES.info) + '"></div>' +
          '<div class="txt"><div class="row"><span class="name"></span><span class="time"></span></div>' +
          '<div class="body"></div></div></div>';
      });
      feed.innerHTML = html;
      feed.querySelectorAll(".card").forEach(function (c, i) {
        var it = items[i];
        c.querySelector(".ic").textContent = it.icon == null ? "" : String(it.icon);
        c.querySelector(".name").textContent = it.title == null ? "" : String(it.title);
        c.querySelector(".time").textContent = it.time == null ? "" : String(it.time);
        c.querySelector(".body").textContent = it.body == null ? "" : String(it.body);
      });
      var set = function (s, x) { var e = document.querySelector(s); if (e && x != null) e.textContent = String(x); };
      set(".kicker", v.kicker); set(".title", v.title);
    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause:function(){}, seek:function(){}, paused:function(){ return true; } };
  </script>
</body></html>

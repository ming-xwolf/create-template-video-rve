<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>RVE Ranked Bars</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('../assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#04060f; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden;
    background: radial-gradient(70% 50% at 78% 12%, rgba(56,189,248,.14), transparent 62%),
                radial-gradient(60% 45% at 12% 88%, rgba(157,123,255,.12), transparent 66%),
                #04060f;
    font-family: 'Noto Sans SC', sans-serif; color:#eef3fb; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

  .head { position:absolute; left:70px; right:70px; top:140px;
    opacity:0; animation:fadeUp .7s ease-out .2s forwards; }
  .kicker { font-size:26px; letter-spacing:.3em; text-transform:uppercase; color:#38bdf8; font-weight:600; }
  .title { margin-top:16px; font-size:52px; font-weight:800; letter-spacing:-.02em; }
  .rows { position:absolute; left:70px; right:70px; top:640px;
    display:flex; flex-direction:column; gap:52px; }
  .row { opacity:0; transform:translateY(14px); animation:fadeUp .6s ease-out var(--d) forwards; }
  .row .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px; }
  .row .name { font-size:40px; font-weight:600; color:#eef3fb; }
  .row .num { font-size:40px; font-weight:800; font-variant-numeric:tabular-nums;
    background:linear-gradient(120deg,#7dd3fc,#9d7bff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .track { height:34px; border-radius:999px; background:rgba(255,255,255,.06); overflow:hidden; }
  .fill { height:100%; border-radius:999px; width:0;
    background:linear-gradient(90deg,#38bdf8,#9d7bff);
    box-shadow:0 0 22px rgba(56,189,248,.45);
    animation:grow 1.5s cubic-bezier(.22,1,.36,1) var(--d) forwards; }
  @keyframes grow { to { width:var(--w); } }

  .grain { position:absolute; inset:0; width:100%; height:100%; opacity:.05; mix-blend-mode:overlay; pointer-events:none; }
</style></head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8"
       data-width="1080" data-height="1920"
       data-composition-variables='{"kicker": "对比", "title": "两个数字的差距", "items": [{"name": "分布式智能体", "value": 700}, {"name": "单个智能体", "value": 11}]}'>

    <div class="head"><div class="kicker"></div><div class="title"></div></div>
    <div class="rows" id="rows"></div>

  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      var items = Array.isArray(v.items) ? v.items.slice(0, 5) : [
        { name: "分布式智能体", value: 700 }, { name: "单个智能体", value: 11 } ];
      var max = 1;
      items.forEach(function (it) { max = Math.max(max, Number(it.value) || 0); });
      var host = document.getElementById("rows"), html = "";
      items.forEach(function (it, i) {
        var pct = Math.max(2, (Number(it.value) || 0) / max * 100);
        html += '<div class="row" style="--d:' + (0.35 + i * 0.16).toFixed(2) + 's">' +
          '<div class="top"><span class="name"></span><span class="num"></span></div>' +
          '<div class="track"><div class="fill" style="--w:' + pct.toFixed(1) + '%"></div></div></div>';
      });
      host.innerHTML = html;
      var rows = host.querySelectorAll(".row");
      items.forEach(function (it, i) {
        rows[i].querySelector(".name").textContent = it.name;
        rows[i].querySelector(".num").textContent = Number(it.value || 0).toLocaleString();
      });
      var set = function (sel, x) { var el = document.querySelector(sel); if (el && x != null) el.textContent = String(x); };
      set(".kicker", v.kicker); set(".title", v.title);

    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause: function(){}, seek: function(){}, paused: function(){ return true; } };
</script>
</body></html>

<!doctype html>
<html lang="zh">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1080, height=1920" />
        <title>Quote Card · 9:16</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('../assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  /*
   * rve-quotecard — 编辑部式引文卡（巨大引号 + 衬线引文 + 滑入署名）。
   * 参考 reactvideoeditor.com 的 Remotion QuoteCard（MIT）：三段 interpolate 依次
   * 点亮引号 / 引文 / 署名，署名同时从右滑入。改写为 CSS keyframes（逐帧渲染下
   * pseudo-state 稳定），色板重映射到 tokens.json，加槽位。
   * 和 rve-quote（玻璃卡 + 聚光灯 + 星级）刻意不同：这是"一句话"的极简版。
   * 竖屏 9:16；横屏见 ../index.html。字号按窄画布重算。
   */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }

  :root {
    --rve-bg: #04060f; --rve-ink: #eef3fb; --rve-muted: #9db0d6;
    --rve-accent: #38bdf8; --rve-violet: #9d7bff;
  }

  #root {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 38%, #0b0a1e 0%, var(--rve-bg) 72%);
    color: var(--rve-ink);
    font-family: 'Noto Sans SC', sans-serif;
  }

  #root::before {
    content: ""; position: absolute; inset: -10%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(40% 30% at 22% 16%, rgba(56,189,248,.13), transparent 64%),
      radial-gradient(44% 32% at 82% 86%, rgba(157,123,255,.11), transparent 68%);
  }
  #root::after {
    content: ""; position: absolute; inset: 0; z-index: 99; pointer-events: none; opacity: .05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  .wrap {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 78px; max-width: 980px;
  }

  /* 三段时间轴：引号 0–0.5s，引文 0.33–1s，署名 1–1.5s（参考 0/10/30 帧 @30fps） */
  @keyframes markIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes textIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes attrIn {
    from { opacity: 0; transform: translateX(40px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .mark {
    font-family: Georgia, 'Songti SC', 'Noto Serif SC', serif;
    font-size: 176px; line-height: .78; font-weight: 400;
    color: var(--rve-accent);
    text-shadow: 0 0 60px rgba(56, 189, 248, .35);
    margin-bottom: 10px;
    animation: markIn .5s ease-out both;
  }

  .quote {
    /* 中文衬线走系统字体（本机 Songti SC），不内嵌 —— 见 NOTICE */
    font-family: Georgia, 'Songti SC', 'Noto Serif SC', serif;
    font-size: 52px; line-height: 1.78; font-weight: 400;
    text-align: center; max-width: 900px; letter-spacing: .01em;
    animation: textIn .67s ease-out .33s both;
  }

  .attr {
    display: flex; align-items: center; gap: 18px;
    margin-top: 72px;
    animation: attrIn .5s cubic-bezier(.22, 1, .36, 1) 1s both;
  }
  .dash {
    width: 46px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, var(--rve-accent), var(--rve-violet));
  }
  .who {
    font-size: 27px; font-weight: 500; letter-spacing: .04em;
    color: rgba(238, 243, 251, .88);
  }
  .role {
    font-size: 21px; font-weight: 300; letter-spacing: .06em;
    color: rgba(157, 176, 214, .85);
  }
  .dotsep { width: 4px; height: 4px; border-radius: 50%; background: rgba(157,176,214,.5); }
  .source {
    font-size: 18px; font-weight: 300; letter-spacing: .1em;
    color: rgba(157, 176, 214, .6);
  }
</style>
    </head>
    <body>
        <div
            id="root"
            data-composition-id="main"
            data-start="0"
            data-duration="6"
            data-width="1080"
            data-height="1920"
            data-composition-variables='{"quote":"设计不只是看起来怎样，设计是它如何运作。","author":"史蒂夫·乔布斯","role":"Apple 联合创始人","source":""}'
        >
            <div class="wrap">
                <div class="mark">&ldquo;</div>
                <p class="quote"></p>
                <div class="attr">
                    <span class="dash"></span>
                    <span class="who"></span>
                    <span class="dotsep"></span>
                    <span class="role"></span>
                    <span class="source"></span>
                </div>
            </div>
        </div>

        <script>
            (function () {
                var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
                    ? window.__hyperframes.getVariables() : {};

                var set = function (sel, text) {
                    var el = document.querySelector(sel);
                    if (el && text != null) el.textContent = String(text);
                };
                set(".quote", v.quote);
                set(".who", v.author || "");

                // 空的 role / source 连同它们的分隔符一起藏掉，免得留下孤零零的圆点。
                var role = document.querySelector(".role");
                var dot = document.querySelector(".dotsep");
                if (role && v.role != null && String(v.role).length) {
                    role.textContent = String(v.role);
                } else if (role && dot) {
                    role.style.display = "none"; dot.style.display = "none";
                }

                var src = document.querySelector(".source");
                if (src && v.source != null && String(v.source).length) {
                    src.textContent = "· " + String(v.source);
                } else if (src) {
                    src.style.display = "none";
                }
            })();
            window.__timelines = window.__timelines || {};
            window.__timelines["main"] = {
                pause: function () {},
                seek: function () {},
                paused: function () { return true; },
            };
        </script>
    </body>
</html>

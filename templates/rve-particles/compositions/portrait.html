<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>RVE Particles</title>
<style>
  @font-face{font-family:'Noto Sans SC';src:url('../assets/fonts/NotoSansSC-subset.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block;}
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:#04060f; }
  #root { position:relative; width:1080px; height:1920px; overflow:hidden;
    background: radial-gradient(70% 55% at 50% 42%, rgba(56,189,248,.16), transparent 64%),
                radial-gradient(60% 50% at 20% 85%, rgba(157,123,255,.12), transparent 68%), #04060f;
    font-family:'Noto Sans SC', sans-serif; color:#eef3fb; }
  .kicker { position:absolute; left:0; right:0; top:576px; text-align:center;
    font-size:26px; letter-spacing:.42em; text-transform:uppercase; color:#38bdf8; font-weight:600;
    opacity:0; animation:fadeIn .9s ease-out 1.5s forwards; }
  @keyframes fadeIn { to { opacity:1; } }
  .stage { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; }
  .line { position:relative; display:flex; font-size:132px; font-weight:900; letter-spacing:-.02em; line-height:1.06; }
  .ch { display:inline-block; opacity:0; filter:blur(18px); transform:translateY(26px) scale(1.12);
    animation:chIn .95s cubic-bezier(.16,1,.3,1) var(--d) forwards; }
  @keyframes chIn { to { opacity:1; filter:blur(0); transform:translateY(0) scale(1); } }
  /* 成型瞬间：整体轻微回弹（scale 1.03 → 1） */
  .stage { animation:settle 1.1s cubic-bezier(.16,1,.3,1) 1.25s both; }
  @keyframes settle { from { transform:scale(1.035); } to { transform:scale(1); } }
  /* 成型闪光：radial + screen 混合，读作"文字被点亮" */
  .flash { position:absolute; left:50%; top:50%; width:980px; height:620px;
    transform:translate(-50%,-50%) scale(.9); border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(125,211,252,.55), rgba(56,189,248,.18) 45%, transparent 70%);
    mix-blend-mode:screen; opacity:0;
    animation:flash 1.15s ease-out 1.35s forwards; }
  @keyframes flash {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(.86); }
    35%  { opacity:.75; }
    100% { opacity:0; transform:translate(-50%,-50%) scale(1.22); } }
  /* 粒子：从四周飞向文字区域后收缩消失。真实粒子聚字需要 canvas 采样字形像素，
     纯 CSS 做不到逐点归位，这里用「随机散点 + 汇聚 + 淡出」近似这个观感。 */
  .dots { position:absolute; left:50%; top:50%; width:0; height:0; }
  .dot { position:absolute; width:7px; height:7px; border-radius:50%;
    background:#7dd3fc; box-shadow:0 0 10px rgba(56,189,248,.85);
    transform:translate(var(--sx), var(--sy)) scale(1); opacity:0;
    animation:fly 1.25s cubic-bezier(.22,1,.36,1) var(--d) forwards; }
  @keyframes fly {
    0%   { opacity:0; transform:translate(var(--sx), var(--sy)) scale(1); }
    18%  { opacity:.95; }
    100% { opacity:0; transform:translate(0, 0) scale(.25); } }
</style></head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8"
       data-width="1080" data-height="1920"
       data-composition-variables='{"kicker":"NEWS","line1":"粒子","line2":"汇聚"}'>
    <div class="dots" id="dots"></div>
    <div class="kicker"></div>
    <div class="flash"></div>
    <div class="stage" id="stage"></div>
  </div>
  <script>
    (function () {
      var v = (window.__hyperframes && typeof window.__hyperframes.getVariables === "function")
        ? window.__hyperframes.getVariables() : {};
      var lines = [v.line1, v.line2].filter(function (x) { return x != null && String(x).length > 0; });
      if (lines.length === 0) lines = ["粒子", "汇聚"];
      var stage = document.getElementById("stage"), html = "";
      var idx = 0;
      lines.forEach(function (txt) {
        var chars = String(txt).split("").map(function (c) {
          var d = (0.35 + idx * 0.075).toFixed(3);
          idx++;
          return '<span class="ch" style="--d:' + d + 's">' + c.replace(/</g, "&lt;") + '</span>';
        }).join("");
        html += '<div class="line">' + chars + '</div>';
      });
      stage.innerHTML = html;
      var dots = document.getElementById("dots"), dh = "", N = 54;
      for (var i = 0; i < N; i++) {
        var ang = (i * 137.508) * Math.PI / 180;         // 黄金角散布，确定性
        var rad = 240 + (i * 53) % 300;
        var sx = Math.cos(ang) * rad, sy = Math.sin(ang) * rad * 0.62;
        var d = (0.05 + (i % 18) * 0.032).toFixed(3);
        dh += '<span class="dot" style="--sx:' + sx.toFixed(0) + 'px;--sy:' + sy.toFixed(0) + 'px;--d:' + d + 's"></span>';
      }
      dots.innerHTML = dh;
      var set = function (s, x) { var e = document.querySelector(s); if (e && x != null) e.textContent = String(x); };
      set(".kicker", v.kicker);
    })();
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = { pause:function(){}, seek:function(){}, paused:function(){ return true; } };
  </script>
</body></html>
